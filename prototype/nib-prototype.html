<title>Nib Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Caveat:wght@500&family=Cedarville+Cursive&family=Dawning+of+a+New+Day&family=Gloria+Hallelujah&family=Homemade+Apple&family=Indie+Flower&family=Kalam:wght@300&family=La+Belle+Aurore&family=Nothing+You+Could+Do&family=Patrick+Hand&family=Playwrite+GB+S&family=Reenie+Beanie&family=Shadows+Into+Light&family=Zeyada&display=swap">
<style>
/* PROTOTYPE v3, throwaway. Studio look, Figtree, ink-blue accent matching the ink-page logo.
   Screens: Home, then Write (Pages or Outline view) → Style → Export. The handwritten page is the only colourful thing. */
:root{
  --bg:#F7F7F8; --surface:#FFFFFF; --surface-2:#F1F1F3; --fg:#16161A; --muted:#6C6C76; --line:#E6E6EA; --line-strong:#D2D2D8;
  --accent:#2F43D0; --on-accent:#FFFFFF; --accent-soft:#ECEFFF; --marker:#FFE266; --desk:#ECECEF; --danger:#D92D3A;
  --pop:0 12px 32px rgba(16,16,24,.16);
  --f-ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --paper:#FBFBF7; --rule:#A7C1E2; --margin-line:#E58C8C; --pen:#20389A; --hl:#FFE36B; --logo-ink:#1E2B7C;
  --bar-bg:#121318; --bar-fg:#F2F3F7; --bar-muted:#9BA1B4;
  --page-shadow:0 1px 1px rgba(20,26,45,.12), 0 8px 24px rgba(20,26,45,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E11; --surface:#16161A; --surface-2:#1F1F25; --fg:#EDEDF1; --muted:#9A9AA6; --line:#27272E; --line-strong:#36363F;
    --accent:#8E9CFF; --on-accent:#0B0C1C; --accent-soft:#1E2246; --marker:#E6CD55; --desk:#08080A; --danger:#FF7B84;
    --pop:0 12px 32px rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E11; --surface:#16161A; --surface-2:#1F1F25; --fg:#EDEDF1; --muted:#9A9AA6; --line:#27272E; --line-strong:#36363F;
  --accent:#8E9CFF; --on-accent:#0B0C1C; --accent-soft:#1E2246; --marker:#E6CD55; --desk:#08080A; --danger:#FF7B84;
  --pop:0 12px 32px rgba(0,0,0,.55); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--fg); font-family:var(--f-ui); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
h1,h2,h3{text-wrap:balance}
svg{flex:none}
#app{height:100%; display:flex; flex-direction:column; gap:10px; padding-block:10px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}

/* Top bar */
.top{flex:none; display:flex; align-items:center; gap:12px; min-height:46px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--fg); border-radius:8px}
.wordmark{font-weight:700; font-size:21px; letter-spacing:-.045em; line-height:1}
.doc{display:flex; align-items:baseline; gap:8px; padding-left:12px; border-left:1px solid var(--line); min-width:0}
.doc input{font-weight:600; border:0; background:none; padding:3px 6px; margin-left:-6px; border-radius:7px; width:15ch; min-width:0}
.doc input:hover{background:var(--surface-2)}
.doc small{color:var(--muted); font-size:12px; white-space:nowrap}
.stages{display:flex; align-items:center; gap:2px; padding:3px; background:var(--surface-2); border-radius:10px; margin-inline:auto}
.stage{display:flex; align-items:center; gap:6px; border:0; background:none; padding:6px 14px; border-radius:8px; font-weight:500; font-size:13.5px; color:var(--muted); cursor:pointer}
.stage .n{font-size:11.5px; font-variant-numeric:tabular-nums; opacity:.7}
.stage[aria-current="step"]{background:var(--surface); color:var(--fg); box-shadow:0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.06)}
.acts{display:flex; gap:4px; align-items:center}
.ibtn{display:grid; place-items:center; width:36px; height:36px; border:0; border-radius:9px; background:none; cursor:pointer; color:var(--muted)}
.ibtn:hover{background:var(--surface-2); color:var(--fg)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:36px; padding:6px 14px; border-radius:9px; border:1px solid var(--line); background:var(--surface); font-weight:500; font-size:13.5px; cursor:pointer; white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent); color:var(--on-accent); border-color:transparent; font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.ghost{background:none; border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.grow{flex:1}
.proto{font:600 10px/1 system-ui, sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border:1px dashed var(--line-strong); padding:5px 7px; border-radius:6px; margin-right:6px}
.home-only{display:none}
body[data-screen="home"] .doc, body[data-screen="home"] .stages, body[data-screen="home"] .ibtn, body[data-screen="home"] #topexport,
body[data-screen="brand"] .doc, body[data-screen="brand"] .stages, body[data-screen="brand"] .ibtn, body[data-screen="brand"] #topexport{display:none}
body[data-screen="home"] .home-only, body[data-screen="brand"] .home-only{display:inline-flex}
body[data-screen="home"] .acts, body[data-screen="brand"] .acts{margin-left:auto}

/* Workspace */
#main{flex:1; min-height:0; display:flex; flex-direction:column}
.ws{flex:1; min-height:0; display:grid; gap:10px; padding-bottom:62px}
.ws.v-pages{grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr)}
.ws.v-outline{grid-template-columns:260px minmax(0,1fr) minmax(320px,380px); grid-template-rows:auto minmax(0,1fr)}
.ws.v-style, .ws.v-export{grid-template-columns:minmax(0,1fr) minmax(330px,390px)}
.wbar{grid-column:1 / -1; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.seg{display:inline-flex; padding:3px; gap:2px; background:var(--surface-2); border-radius:10px}
.seg button{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:0; background:none; padding:5px 11px; border-radius:7px; font-weight:500; font-size:13px; color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--fg); box-shadow:0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.06)}
.pane{background:var(--surface); border:1px solid var(--line); border-radius:12px; min-height:0; min-width:0; display:flex; flex-direction:column; overflow:hidden}
.pane-h{flex:none; display:flex; align-items:center; gap:8px; min-height:48px; padding:6px 10px 6px 16px; border-bottom:1px solid var(--line); font-weight:600; font-size:14px}
.count{color:var(--muted); font-weight:400}
.scroll{flex:1; min-height:0; overflow:auto}
.desk{background:var(--desk); border-radius:12px; min-height:0; min-width:0; overflow:auto; padding:22px 18px 40px; display:flex; flex-direction:column; align-items:center; gap:22px}

/* Toolbar */
.tb{display:inline-flex; align-items:center; gap:1px; padding:3px; background:var(--surface); border:1px solid var(--line); border-radius:10px; flex-wrap:wrap}
.tb button{display:grid; place-items:center; width:32px; height:30px; border:0; border-radius:7px; background:none; cursor:pointer; font-size:14px; color:var(--fg)}
.tb button:hover, .tb select:hover{background:var(--surface-2)}
.tb .sep{width:1px; height:18px; background:var(--line); margin:0 4px}
.tb select{height:30px; border:0; background:none; font-weight:500; font-size:13px; padding:0 4px 0 8px; border-radius:7px; cursor:pointer}
.tb .hlx{background:linear-gradient(transparent 40%, var(--marker) 40% 92%, transparent 92%); padding:0 3px; font-weight:600}
#insp .tb{display:flex; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:5px 8px}

/* Pages (everything inside is in em; 26em = page width) */
.prow{width:100%; max-width:940px; display:flex; flex-direction:column; gap:8px; border-radius:12px; padding:6px}
.prow-h{display:flex; align-items:center; gap:6px; padding:0 2px; font-size:13px}
.prow-h b{font-weight:600}
.grip{display:inline-grid; place-items:center; width:26px; height:26px; border-radius:7px; color:var(--muted); cursor:grab}
.grip:hover{background:var(--surface); color:var(--fg)}
.mini{display:grid; place-items:center; width:30px; height:30px; border:0; border-radius:7px; background:none; cursor:pointer; color:var(--muted); flex:none}
.mini:hover{background:var(--surface-2); color:var(--fg)}
.prow-h .mini:hover{background:var(--surface)}
.meta{color:var(--muted); font-size:12.5px; font-weight:400}
.pair{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:18px}
.pair.one{grid-template-columns:minmax(0,500px); justify-content:center}
.pagewrap{width:min(500px,100%); container-type:inline-size; flex:none}
.pair .pagewrap{width:100%}
.pagecap{font-size:12px; font-weight:500; color:var(--muted); margin-bottom:6px}
.page{--L:1.4; position:relative; width:100%; aspect-ratio:210/297; background:var(--paper); box-shadow:var(--page-shadow); font-size:calc(100cqw / 26); border-radius:2px; overflow:hidden}
.page .rules{position:absolute; inset:2.8em 0 0; background:repeating-linear-gradient(180deg, transparent 0 calc(var(--L) * 1em - 1px), var(--rule) calc(var(--L) * 1em - 1px) calc(var(--L) * 1em))}
.page .mline{position:absolute; top:0; bottom:0; left:3.1em; width:1.5px; background:var(--margin-line)}
.paper-yellow{background:#F9EEAA; --rule:#8AA4BF}
.paper-yellow .mline{box-shadow:.25em 0 0 var(--margin-line)}
.paper-grid{background:#FAFAF6}
.paper-grid .rules{inset:0; background:repeating-linear-gradient(180deg, transparent 0 calc(var(--L) * .5em - 1px), #B9CCE3 calc(var(--L) * .5em - 1px) calc(var(--L) * .5em)), repeating-linear-gradient(90deg, transparent 0 calc(var(--L) * .5em - 1px), #B9CCE3 calc(var(--L) * .5em - 1px) calc(var(--L) * .5em))}
.paper-grid .mline, .paper-plain .mline, .paper-plain .rules{display:none}
.paper-plain{background:#F9F9F6}
.spiral{position:absolute; left:.35em; top:0; bottom:0; width:1em; background:radial-gradient(circle, #CFD2DA 0 .26em, transparent .3em) 0 .5em / 1em 1.4em repeat-y}
.hole{position:absolute; left:1.1em; width:.85em; height:.85em; border-radius:50%; background:#CFD2DA; box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.fx-light::after{content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(120% 70% at 15% 0%, rgba(255,255,255,.35), transparent 60%), linear-gradient(180deg, transparent 55%, rgba(40,30,10,.06))}
.crease{position:absolute; left:0; right:0; top:50%; height:.25em; background:linear-gradient(180deg, rgba(0,0,0,.07), rgba(255,255,255,.7)); pointer-events:none}
.ghost{position:absolute; left:4em; right:2em; top:9em; font-family:"La Belle Aurore", cursive; font-size:1em; line-height:1.4em; color:#20389A; opacity:.06; transform:scaleX(-1); pointer-events:none}
.blank{position:absolute; left:0; right:0; top:44%; text-align:center; font:500 12px/1.4 var(--f-ui); color:#8B8F9C; margin:0; padding:0 2em}
.typed .blank{color:var(--muted)}
.pbox{position:absolute; border:1.5px dashed color-mix(in srgb, var(--bc) 36%, transparent); border-radius:3px; padding:0 .2em; cursor:grab; touch-action:none}
.pbox:hover, .pbox.hover{border-style:solid; border-color:color-mix(in srgb, var(--bc) 70%, transparent)}
.pbox.is-sel{border:2px solid var(--bc); background:color-mix(in srgb, var(--bc) 5%, transparent)}
.pbox.moving{cursor:grabbing; box-shadow:0 6px 18px rgba(0,0,0,.18); z-index:5}
.pbox.clean, .pbox.clean:hover, .pbox.clean.is-sel{border-color:transparent; background:none; cursor:default}
.tag{position:absolute; left:-2px; bottom:100%; font:600 10.5px/1.7 var(--f-ui); color:#fff; background:var(--bc); padding:0 7px; border-radius:4px 4px 0 0; white-space:nowrap; opacity:0; transition:opacity .12s; pointer-events:none}
.pbox:hover .tag, .pbox.hover .tag, .pbox.is-sel .tag, .pbox.moving .tag{opacity:1}
.hw{--k:1; font-family:var(--hf, "La Belle Aurore"), cursive; font-weight:var(--hw, 400); font-size:calc(var(--k) * 1em); line-height:calc(var(--L) * 1em / var(--k)); color:var(--pen); text-shadow:var(--psh, none); opacity:var(--palpha, 1); letter-spacing:var(--ls, 0); word-spacing:var(--ws, 0)}
.hw *{margin:0}
.hw h1{font-size:1.3em; line-height:calc(var(--L) * 2em / (var(--k) * 1.3)); text-align:center; font-weight:inherit; text-decoration:underline double; text-underline-offset:.15em}
.hw h2{font-size:1.1em; line-height:calc(var(--L) * 1em / (var(--k) * 1.1)); font-weight:inherit; text-decoration:underline; text-underline-offset:.15em; margin-top:calc(var(--L) * 1em / (var(--k) * 1.1))}
.hw h1 + h2{margin-top:0}
.hw ol, .hw ul{padding-left:1.3em}
.hw b, .hw strong{font-weight:inherit; text-shadow:var(--psh, 0 0 0 transparent), .35px 0 0 currentColor, -.25px 0 0 currentColor}
.hw mark, .hw [style*="background"]{background:linear-gradient(transparent 28%, var(--hl) 28% 86%, transparent 86%) !important; color:inherit}
.hw s, .hw strike{text-decoration-thickness:1.5px}
.hw blockquote{border-left:2px solid currentColor; padding-left:.5em}
.page.typed{background:var(--surface); box-shadow:none; border:1px solid var(--line)}
.typed .pbox{border-style:solid; border-color:color-mix(in srgb, var(--bc) 50%, transparent); cursor:text; padding:.3em .45em}
.typed .tag{opacity:1; pointer-events:auto; display:flex; align-items:center; gap:3px; height:20px; padding:0 2px 0 3px; cursor:grab; touch-action:none}
.tag .gi{display:grid; place-items:center; opacity:.85}
.tpart{font-weight:500; opacity:.85}
.tagbtn{display:grid; place-items:center; width:18px; height:18px; border:0; border-radius:4px; background:none; color:inherit; cursor:pointer; padding:0}
.tagbtn:hover{background:rgba(255,255,255,.25)}
.typed .rt{font-size:.62em; line-height:1.5; color:var(--fg)}
.typed .rt h1{font-size:1.4em; text-align:center} .typed .rt h2{font-size:1.12em; margin:.5em 0 .2em}
.typed .rt p, .typed .rt ol, .typed .rt ul{margin-bottom:.35em}
.tfields{display:flex; flex-direction:column; gap:.15em; font-size:.6em}
.tfields label{display:flex; gap:.4em; align-items:center; color:var(--muted); font-weight:500}
.tfields input{flex:1; min-width:0; border:0; border-bottom:1px solid var(--line); background:none; padding:.1em .2em; color:var(--fg)}
.addpage{align-self:center}
.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.drop-on{background:var(--accent-soft); outline:2px dashed var(--accent); outline-offset:-2px}

/* Rich text (stands in for TipTap) */
.rt{outline:none; font-size:15px; line-height:1.6; min-height:1.6em; caret-color:var(--accent); overflow-wrap:anywhere}
.rt h1{font-size:20px; font-weight:600; line-height:1.3; margin:0 0 6px; letter-spacing:-.01em}
.rt h2{font-size:16px; font-weight:600; margin:12px 0 4px}
.rt h1 + h2{margin-top:4px}
.rt p{margin:0 0 6px}
.rt ol,.rt ul{margin:0 0 6px; padding-left:22px}
.rt b, .rt strong{font-weight:650}
.rt mark,.rt [style*="background"]{background:var(--marker) !important; color:#121212; border-radius:2px; padding:0 2px}
.rt blockquote{margin:0 0 6px; padding-left:10px; border-left:3px solid var(--line-strong); color:var(--muted)}

/* Outline */
.ol{padding:6px 8px 18px}
.ol-sec{border-radius:10px; padding:2px 0 6px}
.ol-page{display:flex; align-items:center; gap:4px; padding:4px 2px 4px 0; font-size:12px; font-weight:600; color:var(--muted); cursor:grab; border-radius:8px; letter-spacing:.02em}
.ol-page:hover{background:var(--surface-2)}
.ol-item{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:1px 9px; align-items:center; padding:7px 8px; margin-left:12px; border-radius:9px; cursor:grab; border:1px solid transparent}
.ol-item.cont{cursor:pointer}
.ol-item:hover,.ol-item.hover{background:var(--surface-2)}
.ol-item.is-sel{background:color-mix(in srgb, var(--bc) 10%, var(--surface)); border-color:color-mix(in srgb, var(--bc) 45%, transparent)}
.ol-item .name{font-weight:600; font-size:13px}
.ol-item .snip{grid-column:2 / 4; font-size:12px; color:var(--muted); overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.dot{display:inline-block; width:9px; height:9px; border-radius:3px; background:var(--bc); flex:none}
.badge{font-size:11px; font-weight:500; padding:1px 7px; border-radius:999px; background:var(--surface-2); color:var(--muted); white-space:nowrap}
.ol-empty{margin:2px 0 0 12px; padding:10px; border:1px dashed var(--line-strong); border-radius:9px; font-size:12px; color:var(--muted); text-align:center}
.ol-tip{font-size:12px; color:var(--muted); margin:14px 8px 0}
.insp-h{flex:none; display:flex; align-items:center; gap:8px; padding:8px 8px 8px 14px; border-bottom:1px solid var(--line)}
.insp-h input{font-weight:600; font-size:14px; border:0; background:none; padding:4px 6px; border-radius:7px; min-width:0; flex:1}
.insp-h input:hover{background:var(--surface-2)}
.joinbar{display:flex; align-items:center; gap:8px; padding:8px 14px; background:var(--accent-soft); font-size:12.5px; border-bottom:1px solid var(--line)}
.insp-body{padding:14px 16px 20px}
.empty{padding:28px 20px; color:var(--muted); text-align:center}
.pbreak{display:flex; align-items:center; gap:8px; margin:14px 0; font-size:12px; color:var(--muted)}
.pbreak .pb-l{font-weight:600; white-space:nowrap}
.pbreak .rule{flex:1; border-top:1px dashed var(--line-strong)}
.pb-acts{display:flex; gap:4px}
.pb-acts button{border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:3px 8px; font-weight:500; font-size:12px; cursor:pointer; white-space:nowrap}
.pb-acts button:hover{background:var(--surface-2)}
.fields{display:grid; grid-template-columns:auto minmax(0,1fr); gap:8px 12px; align-items:center}
.fields label{font-size:13px; color:var(--muted); font-weight:500}
.fields input{padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); min-width:0}
.hint{font-size:12.5px; color:var(--muted); margin:10px 0 0}

/* Style and Export panels */
.sp{padding:0 0 24px}
.sg{padding:14px 16px 16px; border-bottom:1px solid var(--line)}
.sg:last-child{border-bottom:0}
.sg h3{margin:0 0 10px; font-size:13px; font-weight:600; display:flex; align-items:baseline; gap:8px}
.sg h3 + h3, .sg * + h3{margin-top:16px}
.scopebar{flex:none; padding:10px 16px 12px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; font-size:12.5px; color:var(--muted)}
.scopebar .seg{display:flex}
.scopebar .seg button{flex:1; min-width:0}
.scopebar .seg button span.t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.scopebar .row{display:flex; align-items:center; gap:8px}
.looks{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px}
.lookc{display:flex; flex-direction:column; gap:6px; padding:5px 5px 7px; border:1px solid var(--line); border-radius:10px; background:var(--surface); cursor:pointer; text-align:left; font-size:12px; font-weight:500; min-width:0}
.lookc[aria-pressed="true"]{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.lookc .lsw{height:44px; border-radius:6px; display:flex; align-items:center; padding:0 8px; font-size:22px; overflow:hidden; white-space:nowrap; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.lookc span.n{padding:0 3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.link{border:0; background:none; color:var(--accent); font-weight:500; font-size:13px; cursor:pointer; padding:0}
.link:hover{text-decoration:underline}
.handcur{display:flex; align-items:center; gap:12px; width:100%; padding:6px 12px 6px 6px; border:1px solid var(--line); border-radius:10px; background:var(--surface); cursor:pointer; text-align:left}
.handcur .hs{flex:1; min-width:0; font-size:24px; line-height:1.4; color:var(--pen); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:var(--paper); border-radius:6px; padding:2px 10px}
.handcur .chg{font-size:13px; font-weight:500; color:var(--accent)}
.handcur + .meta{display:block; margin-top:6px}
.pens{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:6px}

/* ================= Structural changes ================= */
// A block's later parts always sit on the pages right after its first part; pages are added when needed.
function reflow(){
  const moved = [];
  for (const id of Object.keys(S.blocks)) {
    const b = S.blocks[id]; if (b.keys.length < 2) continue;
    const start = findSeg(b.keys[0]).pi;
    for (let i = 1; i < b.keys.length; i++) {
      const want = start + i, f = findSeg(b.keys[i]);
      if (f.pi === want) continue;
      let added = false;
      while (S.pages.length <= want) { S.pages.push({ id:'p' + (++S.seq), segs:[] }); added = true; }
      S.pages[f.pi].segs.splice(f.si, 1); S.pages[want].segs.push(f.seg);
      moved.push({ name:b.name, page:want + 1, added });
    }
  }
  return moved;
}
function change(msg, fn){
  closeMenu();
  const before = snap(); if (fn() === false) return;
  const moved = reflow();
  S.hist.push(before); S.future = [];
  if (!S.blocks[S.sel]) S.sel = blockOrder()[0] || null;
  render(); setSaved();
  const m = moved[0];
  toast(msg + (m ? ` The rest of “${m.name}” followed it onto ${m.added ? 'a new ' : ''}page ${m.page}.` : ''), true);
}
function undo(){ const j = S.hist.pop(); if (!j) return toast('Nothing to undo.'); S.future.push(snap()); load(j); render(); toast('Undone.'); }
function redo(){ const j = S.future.pop(); if (!j) return toast('Nothing to redo.'); S.hist.push(snap()); load(j); render(); toast('Redone.'); }
function removeKey(k){ const f = findSeg(k); if (!f) return; S.pages[f.pi].segs.splice(f.si, 1); const b = S.blocks[f.seg.b]; b.keys = b.keys.filter(x => x !== k); if (!b.keys.length) delete S.blocks[f.seg.b]; }
function splitBlock(id, k){
  const b = S.blocks[id], i = b.keys.indexOf(k); if (i < 1) return null;
  const tail = b.keys.slice(i); b.keys = b.keys.slice(0, i);
  const nid = 'b' + (++S.seq);
  S.blocks[nid] = { name:b.name.replace(/ \(continued\)$/, '') + ' (continued)', kind:'text', color:nextColor(), keys:tail, from:id, style:b.style ? { ...b.style } : undefined };
  tail.forEach(t => { findSeg(t).seg.b = nid; });

}
function joinInto(id, target){

  });
}

}
function moveSeg(k, pj){

  const b = S.blocks[f.seg.b];
  if (isCont(k)) return toast(`Part ${b.keys.indexOf(k) + 1} of “${b.name}” always follows the part before it. Split it off first (⋯ → Split) to move it on its own.`);
  change(`Moved “${b.name}” to page ${pj + 1}.`, () => { S.pages[f.pi].segs.splice(f.si, 1); S.pages[pj].segs.push(f.seg); });
}

  split:k => { const f = findSeg(k), b = S.blocks[f.seg.b], at = b.keys.indexOf(k) === 0 ? b.keys[1] : k, pn = findSeg(at).pi + 1;

  pgup:i => movePage(i, i - 1),

const addBtn = `<button class="btn ghost" type="button" data-add>${ICON.plus}Add</button>`;
function renderWrite(){

    <div class="wbar">${viewSwitch()}<div class="seg" role="group" aria-label="Show">${modes.map(([k, l]) => `<button type="button" data-cmode="${k}" aria-pressed="${S.cmode === k}">${l}</button>`).join('')}</div>
      <span class="grow"></span>${TB}<span class="grow"></span>${addBtn}</div>
    <section class="desk" aria-label="Pages">${S.pages.map((p, pi) => `<div class="prow" data-droppage="${pi}">
      <div class="prow-h"><span class="grip" draggable="true" data-dragpage="${pi}" title="Drag to move this page" role="img" aria-label="Drag to move page ${pi + 1}">${ICON.grip}</span><b>Page ${pi + 1}</b><span class="meta">· ${p.segs.length} block${p.segs.length === 1 ? '' : 's'}</span><span class="grow"></span>
        <button class="mini" type="button" data-pagemenu="${pi}" aria-label="Options for page ${pi + 1}">${ICON.dots}</button></div>
      <div class="pair${S.cmode !== 'side' ? ' one' : ''}">${S.cmode !== 'hand' ? typedPage(pi, 'Typed · edit here') : ''}${S.cmode !== 'typed' ? handPage(pi, 'Handwritten') : ''}</div></div>`).join('')}
      <button class="btn ghost addpage" type="button" data-act="addpage">${ICON.plus}Add page</button></section></div>`;
}

    <span class="dot"></span><span class="name">${nameSpan(s.b)}${partText(s.k) ? ` <span class="meta">${partText(s.k)}</span>` : ''}</span>${hasOwn(s.b) ? '<span class="badge">Own style</span>' : '<span></span>'}
    <span class="snip" data-snip="${s.k}">${esc(snippet(s.k))}</span></div>`;
}
function editorFor(id){

function inspector(){

    ${from ? `<div class="joinbar">Split from “${esc(from.name)}”<span class="grow"></span><button class="link" type="button" data-act="join" data-id="${id}">Join back</button></div>` : ''}

function renderOutline(){

        <button class="btn ghost" type="button" data-act="addpage" style="margin:8px 4px 0">${ICON.plus}Add page</button>

    <section class="desk" aria-label="Pages">${S.pages.map((p, pi) => handPage(pi, `Page ${pi + 1}`)).join('')}</section>

}

/* ================= Style ================= */
const curStyle = () => S.scope === 'block' && S.blocks[S.sel] ? eff(S.sel) : S.style;
const slider = (id, label, min, max, step, val, fmt = v => v) => `<div class="slider"><label for="s-${id}">${label}</label><output id="o-${id}">${fmt(val)}</output><input type="range" id="s-${id}" data-slider="${id}" data-fmt="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
const FMT = { size:v => Math.round(v * 100) + '%', spacing:v => ({ 1.2:'Tight', 1.3:'Snug', 1.4:'Normal', 1.5:'Roomy', 1.6:'Wide', 1.7:'Wider', 1.8:'Widest' }[(+v).toFixed(1)] || v), track:v => (v > 0 ? '+' : '') + v, words:v => (v > 0 ? '+' : '') + v + '%' };
const realismOf = st => Object.keys(REALISM).find(k => Object.entries(REALISM[k]).every(([kk, vv]) => st[kk] === vv)) || 'custom';
const lookOf = st => [...LOOKS, ...S.myLooks].find(L => ['font', 'pen', 'ink', 'paper'].every(k => L.v[k] === (k === 'paper' ? S.style.paper : st[k])) && realismOf(st) === realismOf(L.v));
function scopeBar(){
  const b = S.blocks[S.sel];
  if (!b) return `<div class="scopebar">Changes apply to the whole document. Click a block on the page to style it on its own.</div>`;
  const own = hasOwn(S.sel);
  return `<div class="scopebar"><div class="seg" role="group" aria-label="Apply changes to">
      <button type="button" data-scope="doc" aria-pressed="${S.scope !== 'block'}">Whole document</button>
      <button type="button" data-scope="block" aria-pressed="${S.scope === 'block'}"><span class="dot" style="--bc:${col(S.sel)}"></span><span class="t">Only “${esc(b.name)}”</span></button></div>
    ${S.scope === 'block'
      ? `<div class="row">${own ? 'This block has its own style.' : 'Changes here affect only this block.'}<span class="grow"></span>${own ? '<button class="link" type="button" data-matchdoc>Match document</button>' : ''}</div>`
      : `<div class="row">${Object.keys(S.blocks).filter(hasOwn).length ? `${Object.keys(S.blocks).filter(hasOwn).map(x => `“${esc(S.blocks[x].name)}”`).join(', ')} keeps its own style.` : 'Click a block on the page to style it on its own.'}</div>`}</div>`;
}
function stylePanel(){
  const st = curStyle(), h = hand(st.font), look = lookOf(st), real = realismOf(st), blockScope = S.scope === 'block' && S.blocks[S.sel];
  const lookCard = L => { const v = { ...S.style, ...L.v };
    return `<button type="button" class="lookc" data-look="${L.id}" aria-pressed="${look && look.id === L.id}"><span class="lsw paper-${L.v.paper || 'ruled'}" style="background:${{ yellow:'#F9EEAA', grid:'#FAFAF6', plain:'#F9F9F6' }[L.v.paper] || 'var(--paper)'};font-family:${hand(v.font).css}, cursive;color:${v.pen === 'pencil' ? '#55575F' : inkOf(v)};font-size:${Math.round(22 * hand(v.font).k)}px">Homework</span><span class="n">${esc(L.name)}</span></button>`; };
  return `<div class="pane-h">Style<span class="grow"></span><button class="btn ghost" type="button" data-variation title="Draw every letter again with new random shapes">${ICON.reroll}New variation</button></div>
    ${scopeBar()}
    <div class="scroll sp" id="sp">
      <section class="sg"><h3>Looks <span class="meta">hand, pen, ink, paper and realism in one tap</span></h3><div class="looks">${[...LOOKS, ...S.myLooks].map(lookCard).join('')}</div>
        <p class="hint" style="margin-top:10px"><button class="link" type="button" data-savelook>+ Save the current style as a look</button></p></section>
      <section class="sg"><h3>Handwriting</h3><button type="button" class="handcur" data-openhands><span class="hs" style="font-family:${h.css}, cursive;font-weight:${h.w || 400};color:${st.pen === 'pencil' ? '#55575F' : inkOf(st)};font-size:${Math.round(24 * h.k)}px">The water cycle is</span><span class="chg">Change</span></button><span class="meta">${esc(h.name)} · ${h.tags.includes('cursive') ? 'joined-up' : 'print'}</span></section>
      <section class="sg"><h3>Pen</h3><div class="pens">${PENS.map(p => `<button type="button" class="pen" data-pen="${p.id}" aria-pressed="${st.pen === p.id}"><svg viewBox="0 0 100 12" preserveAspectRatio="none" aria-hidden="true"><path d="M3 7 C 25 1, 45 12, 65 5 S 90 4, 97 6" fill="none" stroke="currentColor" stroke-width="${p.w}" stroke-linecap="round" ${p.id === 'pencil' ? 'opacity=".6" stroke-dasharray="7 1.2"' : ''}/></svg>${p.name}<small>${p.note}</small></button>`).join('')}</div>
        <h3>Ink <span class="meta">${st.ink === 'custom' ? 'Your colour' : (INKS.find(i => i.id === st.ink) || INKS[0]).name}</span></h3><div class="inks">${INKS.map(i => `<button type="button" class="ink" data-ink="${i.id}" style="--c:${i.c}" aria-pressed="${st.ink === i.id}" aria-label="${i.name} ink" title="${i.name}"></button>`).join('')}<label class="ink custom" title="Any colour" aria-pressed="${st.ink === 'custom'}"><input type="color" data-custom-ink value="${st.customInk}" aria-label="Pick any ink colour"></label></div></section>
      <section class="sg"><h3>Paper ${blockScope ? '<span class="meta">shared by every page</span>' : ''}</h3><div class="papers">${PAPERS.map(([id, n]) => `<button type="button" class="paperc" data-paper="${id}" aria-pressed="${S.style.paper === id}"><span class="pv pv-${id}" aria-hidden="true"></span>${n}</button>`).join('')}</div>
        <details class="more" data-det="fx" ${S.open.fx ? 'open' : ''}><summary>Paper effects</summary><div class="toggles">${[['light', 'Room lighting'], ['ghost', 'Show-through'], ['crease', 'Fold crease'], ['holes', 'Punch holes']].map(([k, l]) => `<label><input type="checkbox" data-fx="${k}" ${S.style[k] ? 'checked' : ''}> ${l}</label>`).join('')}</div></details></section>
      <section class="sg"><h3>How natural</h3><div class="seg full" role="group" aria-label="How natural">${[['neat', 'Neat'], ['natural', 'Natural'], ['hurried', 'Hurried'], ['messy', 'Messy']].map(([k, l]) => `<button type="button" data-realism="${k}" aria-pressed="${real === k}">${l}</button>`).join('')}</div>
        ${real === 'custom' ? '<p class="hint">Fine-tuned by you.</p>' : ''}
        <details class="more" data-det="fine" ${S.open.fine ? 'open' : ''}><summary>Fine-tune</summary>
          ${slider('mess', 'Natural movement', 0, 100, 1, st.mess)}${slider('variety', 'Vary each letter', 0, 100, 1, st.variety)}${slider('wobble', 'Letter wobble', 0, 100, 1, st.wobble)}${slider('flow', 'Ink flow', 0, 100, 1, st.flow)}${slider('mistakes', 'Mistakes', 0, 100, 1, st.mistakes)}
          <p class="hint">The real engine draws these letter by letter. The prototype only hints at them.</p></details></section>
      <section class="sg"><h3>Size and spacing</h3>${slider('size', 'Letter size', .8, 1.25, .05, st.size, FMT.size)}${slider('spacing', 'Line spacing', 1.2, 1.8, .1, S.style.spacing, FMT.spacing)}
        <details class="more" data-det="space" ${S.open.space ? 'open' : ''}><summary>Letter and word spacing</summary>${slider('track', 'Letter spacing', -3, 8, .5, st.track, FMT.track)}${slider('words', 'Word spacing', -50, 150, 5, st.words, FMT.words)}</details></section>
    </div>`;
}
function renderStyle(){
  return `<div class="ws v-style"><section class="desk" id="sdesk" aria-label="Pages">${S.pages.map((p, pi) => handPage(pi, `Page ${pi + 1}`)).join('')}</section>
    <section class="pane" id="spanel" aria-label="Style">${stylePanel()}</section></div>`;
}
function refreshPanel(){ const sc = $('#sp'), top = sc ? sc.scrollTop : 0; const el = $('#spanel'); if (!el) return; el.innerHTML = stylePanel(); const n = $('#sp'); if (n) n.scrollTop = top; }
function refreshDesk(){ const d = $('#sdesk'); if (d) d.innerHTML = S.pages.map((p, pi) => handPage(pi, `Page ${pi + 1}`)).join(''); paintSel(); }
function applyStyle(obj){
  const target = S.scope === 'block' && S.blocks[S.sel] ? (S.blocks[S.sel].style ||= {}) : S.style;
  for (const [k, v] of Object.entries(obj)) { if (BLOCK_KEYS.includes(k)) target[k] = v; else S.style[k] = v; }
}
function styleChange(obj){
  S.hist.push(snap()); S.future = [];
  applyStyle(obj); refreshDesk(); refreshPanel(); if (S.hp) renderHandList(); setSaved();
}

/* Handwriting picker */

function renderHandList(){

    || `<p class="empty">${f === 'fav' ? 'No favourites yet. Tap ★ on any hand.' : 'No handwriting matches that.'}</p>`;

/* ================= Export ================= */
function estimate(){
  const n = S.exp.pages === 'all' ? S.pages.length : S.exp.sel.filter(i => i < S.pages.length).length;
  const per = { pdf:[.9, 2.3], png:[1.6, 3.8], jpg:[.6, 1.4] }[S.exp.format][S.exp.quality === 'high' ? 1 : 0] * (S.exp.look === 'bw' ? .55 : 1);
  return { n, mb:n * per };
}
function exportPanel(){
  const { n, mb } = estimate(), F = S.exp.format.toUpperCase(), multi = n > 1, zip = S.exp.format !== 'pdf' && multi && S.exp.zip;
  const label = !n ? 'Choose at least one page' : S.exp.format === 'pdf' ? 'Download PDF' : multi ? (zip ? `Download ZIP · ${n} ${F}s` : `Download ${n} ${F}s`) : `Download ${F}`;
  const ext = S.exp.format === 'pdf' ? '.pdf' : zip ? '.zip' : multi ? '-page-1.' + S.exp.format : '.' + S.exp.format;
  const looks = [['none', 'As written'], ['scan', 'Scanned'], ['gray', 'Greyscale scan'], ['bw', 'Black and white']];
  return `<div class="pane-h">Export</div><div class="scroll sp" id="sp">
    <section class="sg"><h3>Format</h3><div class="seg full" role="group" aria-label="Format">${[['pdf', 'PDF'], ['png', 'PNG'], ['jpg', 'JPG']].map(([k, l]) => `<button type="button" data-expfmt="${k}" aria-pressed="${S.exp.format === k}">${l}</button>`).join('')}</div>
      ${S.exp.format !== 'pdf' && multi ? `<label class="tgl"><input type="checkbox" id="exp-zip" ${S.exp.zip ? 'checked' : ''}><span>Put the images in one ZIP<small>One file to send or upload, instead of ${n}.</small></span></label>` : ''}</section>
    <section class="sg"><h3>Pages</h3><div class="radio" role="radiogroup" aria-label="Pages">
      <label><input type="radio" name="exp-pages" data-exppages="all" ${S.exp.pages === 'all' ? 'checked' : ''}> All pages (${S.pages.length})</label>
      <label><input type="radio" name="exp-pages" data-exppages="choose" ${S.exp.pages === 'choose' ? 'checked' : ''}> Choose pages</label></div>
      ${S.exp.pages === 'choose' ? `<p class="hint">Click a page on the left to leave it out or put it back. ${n} of ${S.pages.length} chosen.</p>` : ''}</section>
    <section class="sg"><h3>How it looks</h3><div class="lookcards">${looks.map(([k, l]) => `<button type="button" class="lk look-${k}" data-explook="${k}" aria-pressed="${S.exp.look === k}"><span class="th" aria-hidden="true"></span>${l}</button>`).join('')}</div>
      <label class="tgl"><input type="checkbox" id="exp-tilt" ${S.exp.tilt ? 'checked' : ''}><span>Slight camera tilt<small>Turned a fraction of a degree and cropped a little unevenly, like a quick photo.</small></span></label></section>
    <section class="sg"><h3>Quality</h3><div class="seg full" role="group" aria-label="Quality">${[['standard', 'Standard'], ['high', 'Print quality']].map(([k, l]) => `<button type="button" data-expq="${k}" aria-pressed="${S.exp.quality === k}">${l}</button>`).join('')}</div></section>
    <section class="sg"><h3>File name</h3><div class="fname"><input id="exp-name" value="${esc(S.exp.name)}" aria-label="File name"><span>${ext}</span></div></section>
  </div>
  <div class="exp-f"><div class="row"><button class="btn primary big" type="button" data-download ${n ? '' : 'disabled'}><span>${label}</span><span class="sz">${n ? '~' + mb.toFixed(1) + ' MB' : ''}</span></button>
    <button class="btn" type="button" data-share ${n ? '' : 'disabled'}>Share…</button></div><p class="hint" style="margin:0">Made on this device. Nothing is uploaded.</p></div>`;
}
function renderExport(){
  const pages = S.pages.map((p, pi) => { const inc = S.exp.pages === 'all' || S.exp.sel.includes(pi);
    return `<div class="shotwrap${inc ? '' : ' excluded'}" ${S.exp.pages === 'choose' ? `data-incpage="${pi}" role="button" tabindex="0" aria-pressed="${inc}" aria-label="Page ${pi + 1}, ${inc ? 'included' : 'left out'}"` : ''}>
      <div class="pagecap">Page ${pi + 1}${S.exp.pages === 'choose' ? (inc ? ' · included' : ' · left out') : ''}</div>
      <div class="shot look-${S.exp.look}${S.exp.tilt ? ' tilt' : ''}">${pageEl(pi, { clean:true })}</div></div>`; }).join('');
  return `<div class="ws v-export"><section class="desk" aria-label="Pages as they will download">${pages}</section><section class="pane" id="epanel" aria-label="Export">${exportPanel()}</section></div>`;
}
function refreshExport(){ const sc = $('#sp'), top = sc ? sc.scrollTop : 0; $('#main').innerHTML = renderExport(); const n = $('#sp'); if (n) n.scrollTop = top; }

/* ================= Home ================= */
function miniPage(t){
  const L = LOOKS.find(l => l.id === t.look), v = { ...S.style, ...L.v, paper:t.paper || L.v.paper };
  const paper = v.paper, bits = (paper !== 'plain' ? '<div class="rules"></div><div class="mline"></div>' : '') + (paper === 'spiral' ? '<div class="spiral"></div>' : '');
  const head = t.head ? `<div class="pbox hw clean" style="${handVars(v)}left:13.6em;top:2.8em;width:11.6em"><div>Name: Aarav</div><div>Class: 8-B</div><div>Date: 6 Nov</div></div>` : '';
  const body = t.html ? `<div class="pbox hw clean" style="${handVars(v)}left:${t.card ? '2em' : '3.5em'};top:${t.card ? '14em' : t.head ? '8.4em' : '2.8em'};width:${t.card ? '22em' : '21.6em'}${t.card ? ';--k:' + (hand(v.font).k * 1.15).toFixed(2) : ''}">${t.html}</div>` : '';
  return `<div class="pagewrap"><div class="page paper-${paper}" style="--L:1.4">${bits}${head}${body}</div></div>`;
}

  const sw = [['--logo-ink', 'Ink', 'Logo, brand'], ['--accent', 'Accent', 'Buttons, focus'], ['--fg', 'Text', ''], ['--bg', 'Background', ''], ['--marker', 'Marker', 'Highlights'], ['--margin-line', 'Margin red', 'Paper only']];

/* ================= Render and routing ================= */
const SCREENS = ['home', 'write', 'outline', 'style', 'export', 'brand'];
function render(){
  document.body.dataset.screen = S.screen;
  $('#toplogo').innerHTML = logo(30);
  $$('.stage').forEach(b => { const g = b.dataset.goto; b.setAttribute('aria-current', g === S.screen || (g === 'write' && S.screen === 'outline') ? 'step' : 'false'); });
  const R = { home:renderHome, write:renderWrite, outline:renderOutline, style:renderStyle, export:renderExport, brand:renderBrand };
  $('#main').innerHTML = R[S.screen]();
  if (S.screen !== 'style') closeHands();
  renderSwitch(); renderTry(); paintSel();
}
function renderSwitch(){
  const nav = [['home', 'Home'], ['write', 'Write'], ['style', 'Style'], ['export', 'Export']];
  $('#switch').innerHTML = `<span class="tagp">Prototype</span>${nav.map(([k, l]) => `<button type="button" data-goto="${k}" ${S.screen === k || (k === 'write' && S.screen === 'outline') ? 'aria-current="page"' : ''}>${l}</button>`).join('')}<span class="divider"></span>
    <button type="button" data-opentry>Things to try</button><button type="button" data-goto="brand" ${S.screen === 'brand' ? 'aria-current="page"' : ''}>Brand</button>`;
}
function renderTry(){
  const items = TRY[S.screen] || [], el = $('#try');
  el.hidden = !S.tryOpen || !items.length || matchMedia('(max-width: 860px)').matches;
  el.innerHTML = `<h3>Things to try<span class="grow"></span><button class="mini" type="button" data-closetry aria-label="Close">${ICON.close}</button></h3><ol>${items.map(i => `<li>${i}</li>`).join('')}</ol>`;
}
function paintSel(){ $$('[data-block]').forEach(n => n.classList.toggle('is-sel', n.dataset.block === S.sel && S.screen !== 'export')); }
function select(id){
  if (!id || !S.blocks[id]) return;
  const changed = S.sel !== id; S.sel = id;
  if (changed && S.screen === 'outline') $('#insp').innerHTML = inspector();
  if (changed && S.screen === 'style') { refreshPanel(); if (S.hp) renderSheet(); }
  paintSel();
}
function fromHash(){ const h = location.hash.slice(1); S.screen = SCREENS.includes(h) ? h : 'home'; }
function go(h){ closeMenu(); if (location.hash.slice(1) === h) { fromHash(); render(); } else location.hash = h; }
window.addEventListener('hashchange', () => { closeMenu(); fromHash(); render(); });

/* ================= Text sync ================= */
let lastEditor = null, savedT = 0;
function setSaved(){ const el = $('#saved'); el.textContent = 'Saving…'; clearTimeout(savedT); savedT = setTimeout(() => { el.textContent = 'Saved'; }, 600); }
document.addEventListener('focusin', e => { const ed = e.target.closest && e.target.closest('[data-edit]'); if (ed) lastEditor = ed; });
function syncFrom(ed){
  const k = ed.dataset.edit; S.html[k] = ed.innerHTML;
  $$(`[data-view="${k}"]`).forEach(n => { n.innerHTML = ed.innerHTML; });
  $$(`[data-edit="${k}"]`).forEach(n => { if (n !== ed) n.innerHTML = ed.innerHTML; });
  $$(`[data-snip="${k}"]`).forEach(n => { n.textContent = snippet(k); });
  setSaved();
}
let sliderSnap = null;
document.addEventListener('input', e => {
  const t = e.target;
  const ed = t.closest && t.closest('[data-edit]'); if (ed) return syncFrom(ed);
  if (t.dataset && t.dataset.field) {
    const k = t.dataset.field; S.fields[k] = t.value;
    $$(`[data-fview="${k}"]`).forEach(n => { n.textContent = t.value; });
    $$(`[data-field="${k}"]`).forEach(n => { if (n !== t) n.value = t.value; });
    $$('[data-snip="fields"]').forEach(n => { n.textContent = snippet('fields'); });
    return setSaved();
  }
  if (t.id === 'blockname' && S.blocks[S.sel]) { S.blocks[S.sel].name = t.value; $$(`[data-name="${S.sel}"]`).forEach(n => { n.textContent = t.value; }); return; }
  if (t.dataset && t.dataset.slider) {
    if (!sliderSnap) sliderSnap = snap();
    const id = t.dataset.slider, v = Number(t.value); applyStyle({ [id]:v });
    const o = $('#o-' + id); if (o) o.textContent = (FMT[id] || (x => x))(v);
    refreshDesk(); return;
  }
  if (t.dataset && 'customInk' in t.dataset) { applyStyle({ customInk:t.value, ink:'custom' }); refreshDesk(); return; }
  if (t.id === 'hq') { S.hp.q = t.value; return renderHandList(); }
  if (t.id === 'ht') { S.hp.t = t.value; return renderHandList(); }
  if (t.id === 'exp-name') { S.exp.name = t.value; return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-style]')) { runCmd('fmt:' + t.value); t.value = 'p'; return; }
  if (t.dataset.slider) { if (sliderSnap) { S.hist.push(sliderSnap); S.future = []; sliderSnap = null; } refreshPanel(); setSaved(); return; }
  if (t.dataset && 'customInk' in t.dataset) { S.hist.push(snap()); refreshPanel(); return; }
  if (t.dataset.fx) return styleChange({ [t.dataset.fx]:t.checked });
  if (t.id === 'exp-tilt') { S.exp.tilt = t.checked; return refreshExport(); }
  if (t.id === 'exp-zip') { S.exp.zip = t.checked; return refreshExport(); }
  if (t.dataset.exppages) { S.exp.pages = t.dataset.exppages; return refreshExport(); }
  if (t.dataset.upload != null && t.files && t.files[0]) { toast(`Added “${t.files[0].name}”. In the app it joins the list under Your fonts and is remembered on this device.`); t.value = ''; }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.det) S.open[d.dataset.det] = d.open; }, true);
function runCmd(c){
  const ed = lastEditor && document.contains(lastEditor) ? lastEditor : null;
  if (!ed) return toast('Click into some text first, then format it.');
  if (c === 'break') return toast('A page break sends everything after it to the next page.');
  ed.focus();
  if (c === 'hilite') document.execCommand('hiliteColor', false, '#FFE36B');
  else if (c.startsWith('fmt:')) document.execCommand('formatBlock', false, `<${c.slice(4)}>`);
  else if (c === 'ul') document.execCommand('insertUnorderedList');
  else if (c === 'ol') document.execCommand('insertOrderedList');
  else document.execCommand(c);
  syncFrom(ed);
}

/* ================= Menus ================= */
let openM = null;
function closeMenu(){ if (openM) { openM.remove(); openM = null; } }
function popup(anchor, html){
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu'); m.innerHTML = html;
  document.body.append(m); openM = m; m.anchor = anchor;
  const r = anchor.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  const left = Math.max(12, Math.min(r.right - w, innerWidth - w - 12));
  const top = r.bottom + h + 8 > innerHeight ? Math.max(12, r.top - h - 6) : r.bottom + 6;
  Object.assign(m.style, { position:'fixed', left:left + 'px', top:top + 'px' });
  const f = m.querySelector('input, button:not(:disabled)'); if (f) { f.focus(); if (f.select) f.select(); }
}
const mi = (attrs, label, sub = '', cls = '') => `<button type="button" role="menuitem" class="mi ${cls}" ${attrs}>${label}${sub ? `<small>${sub}</small>` : ''}</button>`;
function blockMenu(anchor, id, k){
  const b = S.blocks[id], multi = b.keys.length > 1, from = b.from && S.blocks[b.from];
  let h = mi(`data-act="rename" data-id="${id}"`, 'Rename', 'Call it “Answers”, “Diagram label”…');
  if (from) h += mi(`data-act="join" data-id="${id}"`, `Join back into “${esc(from.name)}”`, 'It flows on from there again');
  if (multi && k) {
    const first = b.keys.indexOf(k) === 0, pn = findSeg(k).pi + 1;
    h += mi(`data-act="split" data-k="${k}"`, first ? 'Split from the rest' : 'Split into its own block', first ? `Page ${pn} part becomes a separate block` : `Page ${pn} on becomes a separate block`);
    h += mi(`data-act="rmpart" data-k="${k}"`, `Remove the page ${pn} part`, 'Deletes only the text on this page');
  }
  const others = Object.keys(S.blocks).filter(x => x !== id && x !== b.from && S.blocks[x].kind === 'text' && b.kind === 'text');
  if (others.length) h += `<div class="mh">Add to the end of…</div>` + others.map(x => mi(`data-mergeinto="${x}" data-id="${id}"`, `“${esc(S.blocks[x].name)}”`)).join('');
  h += mi(`data-act="ownstyle" data-id="${id}"`, 'Give it its own style', 'Opens Style with “Only this block” on');
  h += `<hr>` + mi(`data-act="delete" data-id="${id}"`, 'Delete block', multi ? 'Every part, on every page' : '', 'danger');
  popup(anchor, h);
}
function pageMenu(anchor, i){
  const n = S.pages.length;
  popup(anchor, mi(`data-act="pgup" data-i="${i}"${i === 0 ? ' disabled' : ''}`, 'Move up') + mi(`data-act="pgdown" data-i="${i}"${i === n - 1 ? ' disabled' : ''}`, 'Move down')
    + mi(`data-act="pgmerge" data-i="${i}"${i === 0 ? ' disabled' : ''}`, 'Merge into previous page', 'Its blocks move onto the page before; text that runs on keeps flowing')
    + mi(`data-act="addpage" data-i="${i + 1}"`, 'Add a page after this one') + '<hr>' + mi(`data-act="pgdel" data-i="${i}"`, 'Delete page', 'And every block on it', 'danger'));
}
function addMenu(anchor){
  popup(anchor, mi('data-addkind="text"', 'Text block', 'Anywhere on a page') + mi('data-addkind="note"', 'Margin note', 'Small and tilted, on the side')
    + mi('data-addkind="head"', 'Header', 'Name, class, subject, date') + '<hr>' + mi('data-act="addpage"', 'Page', 'A blank page at the end'));
}
function formMenu(anchor, kind, id, label, value){
  popup(anchor, `<form class="ren" data-form="${kind}" data-id="${id || ''}"><label for="ren-in">${label}</label><input id="ren-in" value="${esc(value)}"><button class="btn primary" type="submit">Save</button></form>`);
}
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  const v = f.querySelector('input').value.trim(), kind = f.dataset.form, id = f.dataset.id;
  if (kind === 'rename') { const name = v || S.blocks[id].name; change(`Renamed to “${name}”.`, () => { S.blocks[id].name = name; }); }
  if (kind === 'look') { const L = { id:'my' + (++S.seq), name:v || 'My look', v:{ ...curStyle(), paper:S.style.paper } }; S.myLooks.push(L); closeMenu(); refreshPanel(); toast(`Saved “${L.name}”. It’s in Looks on every document.`); }
});

/* ================= Toast ================= */
let toastT = 0;
function toast(msg, withUndo){
  const t = $('#toast'); t.hidden = false;
  t.innerHTML = `<span>${esc(msg)}</span>${withUndo ? '<button type="button" data-undo>Undo</button>' : ''}`;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, withUndo ? 7000 : 3800);
}

/* ================= Clicks ================= */
let suppressClick = false;
document.addEventListener('mousedown', e => { if (e.target.closest && e.target.closest('.tb button')) e.preventDefault(); });
document.addEventListener('click', e => {
  const t = e.target; if (!t.closest) return;
  if (suppressClick) { suppressClick = false; return; }
  const q = s => t.closest(s); let el;
  if ((el = q('[data-undo]'))) { $('#toast').hidden = true; return undo(); }
  if (q('#undo-btn')) return undo();
  if (q('#redo-btn')) return redo();
  if ((el = q('[data-goto]'))) return go(el.dataset.goto);
  if (q('[data-opentry]')) { S.tryOpen = !S.tryOpen; return renderTry(); }
  if (q('[data-closetry]')) { S.tryOpen = false; return renderTry(); }
  if ((el = q('[data-closehands]'))) return closeHands();
  if ((el = q('[data-star]'))) { const id = el.dataset.star; S.favs = S.favs.includes(id) ? S.favs.filter(x => x !== id) : [...S.favs, id]; return renderHandList(); }
  if ((el = q('[data-hfilter]'))) { S.hp.f = el.dataset.hfilter; return renderSheet(); }
  if ((el = q('[data-hand]'))) return styleChange({ font:el.dataset.hand });
  if ((el = q('[data-cmode]'))) { S.cmode = el.dataset.cmode; return render(); }
  if ((el = q('.tb [data-cmd]'))) return runCmd(el.dataset.cmd);
  if ((el = q('[data-segmenu]'))) { const k = el.dataset.segmenu; select(findSeg(k).seg.b); return blockMenu(el, findSeg(k).seg.b, k); }
  if ((el = q('[data-menu]'))) return blockMenu(el, el.dataset.menu, null);
  if ((el = q('[data-pagemenu]'))) return pageMenu(el, +el.dataset.pagemenu);
  if ((el = q('[data-docmenu]'))) { e.stopPropagation(); return popup(el, mi('data-soon="Rename it here or from its title at the top."', 'Rename') + mi('data-soon="Makes a copy with “(copy)” on the end."', 'Duplicate') + '<hr>' + mi('data-soon="Asks first, then keeps it in Recently deleted for 30 days."', 'Delete', '', 'danger')); }
  if ((el = q('[data-addkind]'))) return addBlock(el.dataset.addkind);
  if ((el = q('[data-mergeinto]'))) return joinInto(el.dataset.id, el.dataset.mergeinto);
  if ((el = q('[data-act]'))) {
    if (el.disabled) return;
    const a = el.dataset.act;
    if (a === 'rename') return formMenu(openM && openM.anchor || el, 'rename', el.dataset.id, 'Block name', S.blocks[el.dataset.id].name);
    if (a === 'ownstyle') { S.sel = el.dataset.id; S.scope = 'block'; return go('style'); }
    if (a === 'delete' || a === 'join') return ACTIONS[a](el.dataset.id);
    if (a === 'split' || a === 'rmpart') return ACTIONS[a](el.dataset.k);
    return ACTIONS[a](el.dataset.i == null ? undefined : +el.dataset.i);
  }
  if ((el = q('[data-add]'))) return addMenu(el);
  if ((el = q('[data-scope]'))) { S.scope = el.dataset.scope; refreshPanel(); if (S.hp) renderSheet(); return; }
  if (q('[data-matchdoc]')) { S.hist.push(snap()); delete S.blocks[S.sel].style; refreshDesk(); refreshPanel(); return toast(`“${S.blocks[S.sel].name}” matches the document again.`); }
  if ((el = q('[data-look]'))) { const L = [...LOOKS, ...S.myLooks].find(x => x.id === el.dataset.look); const v = { ...L.v }; if (S.scope === 'block') delete v.paper; return styleChange(v); }
  if ((el = q('[data-savelook]'))) return formMenu(el, 'look', '', 'Name this look', 'My look');
  if (q('[data-openhands]')) return openHands();
  if ((el = q('[data-pen]'))) return styleChange({ pen:el.dataset.pen });
  if ((el = q('[data-ink]'))) return styleChange({ ink:el.dataset.ink });
  if ((el = q('[data-paper]'))) { if (S.scope === 'block') toast('Paper is shared by every page, so this changed the whole document.'); return styleChange({ paper:el.dataset.paper }); }
  if ((el = q('[data-realism]'))) return styleChange({ ...REALISM[el.dataset.realism] });
  if (q('[data-variation]')) { styleChange({ seed:S.style.seed + 1 }); return toast('Drew every letter again with new random shapes.'); }
  if ((el = q('[data-expfmt]'))) { S.exp.format = el.dataset.expfmt; return refreshExport(); }
  if ((el = q('[data-explook]'))) { S.exp.look = el.dataset.explook; return refreshExport(); }
  if ((el = q('[data-expq]'))) { S.exp.quality = el.dataset.expq; return refreshExport(); }
  if ((el = q('[data-incpage]'))) { const i = +el.dataset.incpage; S.exp.sel = S.exp.sel.includes(i) ? S.exp.sel.filter(x => x !== i) : [...S.exp.sel, i].sort(); return refreshExport(); }
  if (q('[data-download]')) { const { mb } = estimate(); return toast(`In the app this saves ${S.exp.name || 'the-water-cycle'}${$('.fname span').textContent} (~${mb.toFixed(1)} MB). Downloads are blocked in this preview.`); }
  if (q('[data-share]')) return toast('On a phone this opens the share sheet: WhatsApp, Drive, Mail and so on.');
  if ((el = q('[data-tpl]'))) { const T = TEMPLATES.find(x => x.id === el.dataset.tpl); return toast(`Would start a new “${T.name}” document. The prototype only has The Water Cycle, so open it from Recent.`); }
  if ((el = q('[data-recent]'))) { if (el.dataset.recent === 'water') return go('write'); return toast('The prototype only has The Water Cycle.'); }
  if (q('[data-import]')) return toast('Opens a file picker for PDF, Word or text. Dropping a file anywhere does the same.');
  if ((el = q('[data-soon]'))) { closeMenu(); return toast(el.dataset.soon); }
  if (!q('.menu')) closeMenu();
  if ((el = q('[data-block]'))) select(el.dataset.block);
});
let hoverId = null;
document.addEventListener('pointerover', e => {
  const b = e.target.closest && e.target.closest('[data-block]'); const id = b ? b.dataset.block : null;
  if (id === hoverId) return; hoverId = id;
  $$('[data-block]').forEach(n => n.classList.toggle('hover', !!id && n.dataset.block === id));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (openM) return closeMenu(); if (S.hp) return closeHands(); }
  const t = e.target, typing = t.closest && t.closest('input, textarea, select, [contenteditable="true"]');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); return e.shiftKey ? redo() : undo(); }
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('.ol-item, .hrow, .rrow, [data-incpage]') && !e.target.closest('button')) { e.preventDefault(); t.click(); }
});

/* ================= Drag a block on the page (snaps to lines) ================= */
let drag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest && e.target.closest('[data-dragseg]');
  if (!h || e.button !== 0 || e.target.closest('button, input, [contenteditable="true"]')) return;
  const page = h.closest('.page'), f = findSeg(h.dataset.dragseg); if (!page || !f) return;
  e.preventDefault();
  drag = { k:f.seg.k, sx:e.clientX, sy:e.clientY, x0:f.seg.x, y0:f.seg.y, em:parseFloat(getComputedStyle(page).fontSize), moved:false, before:snap(), L:S.style.spacing };
  try { h.setPointerCapture(e.pointerId); } catch (err) {}
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4) return;
  const f = findSeg(drag.k); if (!f) return;
  if (!drag.moved) { drag.moved = true; S.hist.push(drag.before); S.future = []; }
  const s = f.seg, L = drag.L;
  s.x = Math.round(Math.min(26 - s.w, Math.max(0, drag.x0 + (e.clientX - drag.sx) / drag.em)) * 10) / 10;
  s.y = Math.round((2.8 + Math.round((Math.min(33, Math.max(0, drag.y0 + (e.clientY - drag.sy) / drag.em)) - 2.8) / L) * L) * 10) / 10;
  $$(`[data-seg="${drag.k}"]`).forEach(n => { n.style.left = s.x + 'em'; n.style.top = s.y + 'em'; n.classList.add('moving'); });
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  if (drag.moved) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 0); $$('.moving').forEach(n => n.classList.remove('moving')); setSaved(); select(findSeg(drag.k).seg.b); }
  drag = null;
});

/* ================= Drag pages and blocks between pages ================= */
let dnd = null;
const clearDrop = () => $$('.drop-before, .drop-after, .drop-on').forEach(n => n.classList.remove('drop-before', 'drop-after', 'drop-on'));
document.addEventListener('dragstart', e => {
  const o = e.target.closest && e.target.closest('[data-dragol]'), p = e.target.closest && e.target.closest('[data-dragpage]');
  if (o) dnd = { type:'seg', k:o.dataset.dragol }; else if (p) dnd = { type:'page', i:+p.dataset.dragpage }; else return;
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dnd.type);
});
document.addEventListener('dragover', e => {
  const t = dnd && e.target.closest && e.target.closest('[data-droppage]'); if (!t) return;
